<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SoniExchange - Client Portal</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            /* Exact reference site teal/blue-green theme match */
            background: linear-gradient(180deg, #1f4e5b 0%, #173b45 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            color: #ffffff;
        }

        /* Top Brand Header */
        .brand-header {
            margin-top: 50px;
            text-align: center;
        }

        .brand-logo {
            font-size: 42px;
            font-style: italic;
            letter-spacing: 2px;
            color: #ffffff;
            font-weight: 700;
            text-shadow: 0 2px 10px rgba(0,0,0,0.3);
        }

        /* Login Card */
        .login-card {
            background: #ffffff;
            width: 88%;
            max-width: 360px;
            border-radius: 8px;
            padding: 24px 20px 20px 20px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.4);
            margin: 20px 0;
        }

        .card-title {
            color: #173b45;
            font-size: 22px;
            text-align: center;
            margin-bottom: 18px;
            font-weight: 600;
        }

        .card-title i {
            font-size: 18px;
            margin-left: 4px;
        }

        /* Form Inputs */
        .input-group {
            display: flex;
            margin-bottom: 14px;
            border: 1px solid #cbd5e1;
            border-radius: 4px;
            overflow: hidden;
            background: #ffffff;
        }

        .input-group input {
            flex: 1;
            padding: 12px 14px;
            border: none;
            outline: none;
            font-size: 15px;
            color: #334155;
        }

        .input-group .icon-box {
            width: 45px;
            background: #f8fafc;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #475569;
            font-size: 15px;
            border-left: 1px solid #e2e8f0;
        }

        /* Buttons */
        .btn {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 4px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: 0.2s ease;
        }

        .btn-primary {
            background: #173b45; 
            color: #ffffff;
            margin-top: 14px;
            margin-bottom: 10px;
        }

        .btn-primary:active {
            background: #1f4e5b;
        }

        .btn-secondary {
            background: #1f4e5b;
            color: #ffffff;
        }

        .btn-secondary:active {
            background: #173b45;
        }

        /* Footer Layout */
        .footer {
            width: 100%;
            background: #112830;
            padding: 14px 10px;
            text-align: center;
        }

        .footer-links {
            display: flex;
            justify-content: space-around;
            font-size: 13px;
            color: #cbd5e1;
            margin-bottom: 8px;
            max-width: 400px;
            margin-left: auto;
            margin-right: auto;
        }

        .footer-links a {
            color: #ffffff;
            text-decoration: underline;
        }

        .support-text {
            font-size: 17px;
            color: #ffffff;
            font-weight: bold;
            letter-spacing: 0.5px;
        }
    </style>
</head>
<body>

    <!-- Header Logo -->
    <div class="brand-header">
        <div class="brand-logo">SONIEXCHANGE</div>
    </div>

    <!-- Main Card -->
    <div class="login-card">
        <div class="card-title">Login <i class="fa-solid fa-hand-pointer"></i></div>

        <form id="loginForm" onsubmit="event.preventDefault(); handleLogin();">
            <div class="input-group">
                <input type="text" id="username" placeholder="Username" required>
                <div class="icon-box"><i class="fa-solid fa-user"></i></div>
            </div>

            <div class="input-group">
                <input type="password" id="password" placeholder="Password" required>
                <div class="icon-box"><i class="fa-solid fa-key"></i></div>
            </div>

            <button type="submit" class="btn btn-primary">
                Login <i class="fa-solid fa-right-to-bracket"></i>
            </button>
            
            <button type="button" class="btn btn-secondary" onclick="demoLogin()">
                Login with demo ID <i class="fa-solid fa-right-to-bracket"></i>
            </button>
        </main>
    </div>

    <!-- Footer -->
    <div class="footer">
        <div class="footer-links">
            <a href="#">Terms and Conditions</a>
            <a href="#">Responsible Gaming</a>
        </div>
        <div class="support-text">24X7 Support</div>
    </div>

    <script>
        function handleLogin() {
            alert("Logging into SoniExchange Client Portal...");
        }

        function demoLogin() {
            document.getElementById('username').value = "demo_client";
            document.getElementById('password').value = "demo123";
            handleLogin();
        }
    </script>
</body>
</html>
