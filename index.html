<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SoniExchange - Client Portal</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            /* Exact Admin Panel Matching Blue */
            background: #0284c7;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            color: #ffffff;
        }

        .main-container {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            flex: 1;
            padding: 20px;
        }

        /* Top Brand Header */
        .brand-header {
            margin-bottom: 25px;
            text-align: center;
        }

        .brand-logo {
            font-size: 38px;
            font-style: italic;
            letter-spacing: 2px;
            color: #ffffff;
            font-weight: 800;
            text-shadow: 0 2px 8px rgba(0,0,0,0.2);
        }

        /* Login Card */
        .login-card {
            background: #ffffff;
            width: 100%;
            max-width: 400px;
            border-radius: 8px;
            padding: 30px 24px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
        }

        .card-title {
            color: #0284c7;
            font-size: 24px;
            text-align: center;
            margin-bottom: 20px;
            font-weight: 700;
        }

        .card-title i {
            font-size: 20px;
            margin-left: 6px;
        }

        /* Form Inputs */
        .input-group {
            display: flex;
            margin-bottom: 16px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            overflow: hidden;
            background: #ffffff;
        }

        .input-group input {
            flex: 1;
            padding: 14px;
            border: none;
            outline: none;
            font-size: 16px;
            color: #334155;
        }

        .input-group .icon-box {
            width: 50px;
            background: #f8fafc;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #475569;
            font-size: 16px;
            border-left: 1px solid #e2e8f0;
        }

        /* Buttons matching Admin style */
        .btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: 0.2s ease;
        }

        .btn-primary {
            background: #0284c7; 
            color: #ffffff;
            margin-top: 16px;
            margin-bottom: 12px;
        }

        .btn-primary:hover {
            background: #0369a1;
        }

        .btn-secondary {
            background: #0f172a;
            color: #ffffff;
        }

        .btn-secondary:hover {
            background: #1e293b;
        }

        /* Footer Layout */
        .footer {
            width: 100%;
            background: #0369a1;
            padding: 16px 10px;
            text-align: center;
            border-top: 1px solid rgba(255,255,255,0.2);
        }

        .footer-links {
            display: flex;
            justify-content: center;
            gap: 30px;
            font-size: 14px;
            color: #e0f2fe;
            margin-bottom: 8px;
        }

        .footer-links a {
            color: #ffffff;
            text-decoration: underline;
        }

        .support-text {
            font-size: 18px;
            color: #ffffff;
            font-weight: bold;
            letter-spacing: 0.5px;
        }

        @media (min-width: 768px) {
            .login-card {
                padding: 40px 35px;
            }
            .brand-logo {
                font-size: 46px;
            }
        }
    </style>
</head>
<body>

    <div class="main-container">
        <!-- Header Logo -->
        <div class="brand-header">
            <div class="brand-logo">SONIEXCHANGE</div>
        </div>

        <!-- Main Card -->
        <div class="login-card">
            <div class="card-title">Login <i class="fa-solid fa-hand-pointer"></i></div>

            <form id="loginForm" onsubmit="event.preventDefault(); handleLogin();">
                <div class="input-group">
                    <input type="text" id="username" placeholder="Username" required>
                    <div class="icon-box"><i class="fa-solid fa-user"></i></div>
                </div>

                <div class="input-group">
                    <input type="password" id="password" placeholder="Password" required>
                    <div class="icon-box"><i class="fa-solid fa-key"></i></div>
                </div>

                <button type="submit" class="btn btn-primary">
                    Login <i class="fa-solid fa-right-to-bracket"></i>
                </button>
                
                <button type="button" class="btn btn-secondary" onclick="demoLogin()">
                    Login with demo ID <i class="fa-solid fa-right-to-bracket"></i>
                </button>
            </form>
        </div>
    </div>

    <!-- Footer -->
    <div class="footer">
        <div class="footer-links">
            <a href="#">Terms and Conditions</a>
            <a href="#">Responsible Gaming</a>
        </div>
        <div class="support-text">24X7 Support</div>
    </div>

    <script>
        function handleLogin() {
            alert("Logging into SoniExchange Client Portal...");
        }

        function demoLogin() {
            document.getElementById('username').value = "demo_client";
            document.getElementById('password').value = "demo123";
            handleLogin();
        }
    </script>
</body>
</html>
